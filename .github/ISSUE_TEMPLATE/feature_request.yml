name: Feature Request
description: Suggest a new tool, capability, or improvement
title: "feat: "
labels: ["type: feature", "status: needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the pain point. What can't you do today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to happen?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What else did you consider? Why is this the right approach?

  - type: dropdown
    id: area
    attributes:
      label: Which area does this touch?
      options:
        - Memory Engine
        - Knowledge Graph Engine
        - Code Intelligence Engine
        - CLI
        - MCP Server
        - Documentation
        - Infrastructure / CI
    validations:
      required: true
